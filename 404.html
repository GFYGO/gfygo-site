<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | GWL</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./favicon.png" type="image/png">
    <style>
        .error-page {
            min-height: calc(100vh - var(--header-height));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 1.25rem;
            color: var(--color-text-muted);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__logo">GWL Works Lab</div>
        <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>
        <nav class="header__nav" id="headerNav">
            <a href="./index.html">首页</a>
            <a href="./document.html">文档</a>
            <a href="./login.html">登录</a>
            <a href="./register.html">注册</a>
        </nav>
        <div class="header__actions">
            <div id="auth-container"></div>
        </div>
    </header>

    <div class="error-page">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <p class="error-message">抱歉，您访问的页面不存在。</p>
            <a href="./index.html" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">返回首页</a>
        </div>
    </div>

    <!-- 主题切换悬浮按钮 -->
    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./config.js"></script>
    <script src="./theme.js"></script>
    <script src="./toast.js"></script>
    <script src="./index.js"></script>
</body>
</html>
