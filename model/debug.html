<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="dns-prefetch" href="//back.gwl.net.cn">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex, nofollow">
  <title>Debug Shell | GWL</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <!-- ⭐ 复用全站 config.js：BASE_PATH / AuthGuard / API_BASE_URL / 导航预取加速 -->
  <script src="../js/config.js?v=20261026c"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileReady&render=explicit" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; color: #e2e8f0; height: 100vh; overflow: hidden; }

    /* ===== 警告页 ===== */
    #warningOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #0a0e14;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s;
    }
    #warningOverlay.hidden { opacity: 0; pointer-events: none; }
    .warning-box {
      max-width: 560px; padding: 40px; text-align: center;
      border: 1px solid #ef4444; border-radius: 8px; background: #1a1a2e;
    }
    .warning-box h1 { color: #ef4444; font-size: 1.4rem; margin-bottom: 16px; }
    .warning-box p { color: #94a3b8; font-size: 0.85rem; line-height: 1.7; margin-bottom: 12px; }
    .warning-box .countdown { color: #f59e0b; font-size: 2rem; font-weight: 700; margin: 16px 0; }
    .warning-box .agree-btn {
      padding: 10px 32px; border: 1px solid #ef4444; border-radius: 6px;
      background: transparent; color: #ef4444; font-size: 0.9rem;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .warning-box .agree-btn:hover { background: #ef4444; color: #fff; }
    .warning-box .agree-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== Turnstile 门 ===== */
    #turnstileGate {
      position: fixed; inset: 0; z-index: 9998;
      background: #0a0e14;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #turnstileGate.active { display: flex; }
    .gate-box {
      padding: 40px; text-align: center;
      border: 1px solid #334155; border-radius: 8px; background: #1a1a2e;
    }
    .gate-box h2 { color: #e2e8f0; font-size: 1.1rem; margin-bottom: 20px; }
    .gate-box .hint { color: #64748b; font-size: 0.8rem; margin-top: 12px; }

    /* ===== Shell 终端 ===== */
    #shellContainer {
      display: none; flex-direction: column; height: 100vh;
      background: #0a0e14;
    }
    #shellContainer.active { display: flex; }

    #shellHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #1a1a2e; border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    #shellHeader .title { color: #22c55e; font-size: 0.8rem; font-weight: 700; }
    #shellHeader .status { color: #64748b; font-size: 0.7rem; }
    #shellHeader .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    #shellHeader .status .dot.online { background: #22c55e; }
    #shellHeader .status .dot.offline { background: #ef4444; }

    #shellOutput {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      font-size: 0.8rem; line-height: 1.6;
    }
    #shellOutput::-webkit-scrollbar { width: 6px; }
    #shellOutput::-webkit-scrollbar-track { background: #0a0e14; }
    #shellOutput::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .shell-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
    .shell-line .prompt { color: #22c55e; }
    .shell-line .cmd { color: #e2e8f0; }
    .shell-line .info { color: #38bdf8; }
    .shell-line .ok { color: #22c55e; }
    .shell-line .warn { color: #f59e0b; }
    .shell-line .err { color: #ef4444; }
    .shell-line .dim { color: #64748b; }
    .shell-line .highlight { color: #a78bfa; font-weight: 700; }
    .shell-line .json { color: #94a3b8; font-size: 0.75rem; }

    #shellInputLine {
      display: flex; align-items: center; padding: 6px 16px;
      background: #0a0e14; border-top: 1px solid #1e293b; flex-shrink: 0;
    }
    #shellInputLine .prompt { color: #22c55e; font-size: 0.8rem; margin-right: 8px; white-space: nowrap; }
    #shellInput {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e2e8f0; font-size: 0.8rem; font-family: inherit;
      caret-color: #22c55e;
    }

    .shell-banner {
      color: #22c55e; font-size: 0.7rem; line-height: 1.4; margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .warning-box, .gate-box { margin: 16px; padding: 24px; }
      #shellOutput { font-size: 0.75rem; padding: 8px 10px; }
      #shellHeader { flex-wrap: wrap; gap: 6px; }
    }

    /* ===== 顶栏操作（2026-10-18） ===== */
    #shellHeader .actions {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    #shellHeader .actions a,
    #shellHeader .actions button {
      padding: 3px 9px; border: 1px solid #334155; border-radius: 4px;
      background: transparent; color: #94a3b8; font-family: inherit;
      font-size: 0.7rem; line-height: 1.4; cursor: pointer; text-decoration: none;
    }
    #shellHeader .actions a:hover,
    #shellHeader .actions button:hover { color: #22c55e; border-color: #22c55e; }

    /* ===== 浅色终端主题（theme light） ===== */
    body.light { background: #f8fafc; color: #0f172a; }
    body.light #shellContainer { background: #f8fafc; }
    body.light #shellHeader { background: #e2e8f0; border-bottom-color: #cbd5e1; }
    body.light #shellHeader .title { color: #15803d; }
    body.light #shellHeader .status { color: #64748b; }
    body.light #shellHeader .actions a,
    body.light #shellHeader .actions button { color: #475569; border-color: #cbd5e1; }
    body.light #shellHeader .actions a:hover,
    body.light #shellHeader .actions button:hover { color: #15803d; border-color: #15803d; }
    body.light #shellOutput { background: #f8fafc; }
    body.light .shell-line .prompt { color: #15803d; }
    body.light .shell-line .cmd { color: #0f172a; }
    body.light .shell-line .info { color: #0369a1; }
    body.light .shell-line .ok { color: #15803d; }
    body.light .shell-line .warn { color: #b45309; }
    body.light .shell-line .err { color: #b91c1c; }
    body.light .shell-line .dim { color: #64748b; }
    body.light .shell-line .highlight { color: #6d28d9; }
    body.light .shell-line .json { color: #475569; }
    body.light .shell-banner { color: #15803d; }
    body.light #shellInputLine { background: #f8fafc; border-top-color: #e2e8f0; }
    body.light #shellInputLine .prompt { color: #15803d; }
    body.light #shellInput { color: #0f172a; }
  </style>
</head>
<body>

  <!-- ===== 警告页 ===== -->
  <div id="warningOverlay">
    <div class="warning-box">
      <h1>⚠️ 非开发者警告</h1>
      <p>此页面为 <strong>Debug Shell</strong> 调试终端，仅供开发人员和管理员使用。</p>
      <p>非授权访问可能导致系统安全风险。请确认您已获得授权后再继续操作。</p>
      <div class="countdown" id="countdown">4</div>
      <button class="agree-btn" id="agreeBtn" disabled>我已了解，继续 (4s)</button>
    </div>
  </div>

  <!-- ===== Turnstile 验证门 ===== -->
  <div id="turnstileGate">
    <div class="gate-box">
      <h2>🔐 人机验证</h2>
      <div id="turnstile-widget-debug"></div>
      <div class="hint">请完成验证以进入 Debug Shell</div>
    </div>
  </div>

  <!-- ===== Shell 终端 ===== -->
  <div id="shellContainer">
    <div id="shellHeader">
      <span class="title">GWL Debug Shell v1.1</span>
      <span class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">disconnected</span>
      </span>
      <span class="actions">
        <a href="./index.html">模型首页</a>
        <a href="./test.html">测试面板</a>
        <a href="../index.html">站点首页</a>
        <button type="button" id="copyOutputBtn" title="复制终端全部输出">复制输出</button>
        <button type="button" id="clearBtn" title="清屏（等价 clear）">清屏</button>
      </span>
    </div>
    <div id="shellOutput"></div>
    <div id="shellInputLine">
      <span class="prompt" id="inputPrompt">$</span>
      <input type="text" id="shellInput" autofocus spellcheck="false" autocomplete="off" placeholder="输入 help 查看命令列表">
    </div>
  </div>

  <script>
    // =========================================
    // 配置
    // =========================================
    const SITEKEY = '0x4AAAAAAECyOCbL7qIJUOgg';
    // API 基址 / AuthGuard / BASE_PATH 来自 ../js/config.js（全站共享）
    var API_BASE = (window.API_BASE_URL || 'https://back.gwl.net.cn') + '/api/v0';
    var SITE_BASE = (typeof BASE_PATH === 'string') ? BASE_PATH : '..';
    var SHELL_VERSION = '1.1';
    var builtinCommands = ['help', 'health', 'status', 'login', 'logout', 'whoami', 'token', 'perm',
      'switch', 'theme', 'doc', 'notify', 'user', 'admin', 'open', 'history', 'copy',
      'selftest', 'about', 'clear', 'echo', 'date', 'exit'];
    var currentUser = null;

    // =========================================
    // 警告页逻辑
    // =========================================
    (function() {
      var countdownEl = document.getElementById('countdown');
      var agreeBtn = document.getElementById('agreeBtn');
      var warningOverlay = document.getElementById('warningOverlay');
      var turnstileGate = document.getElementById('turnstileGate');
      var count = 4;

      function tick() {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
          agreeBtn.disabled = false;
          agreeBtn.textContent = '我已了解，继续';
          clearInterval(timer);
        }
      }
      var timer = setInterval(tick, 1000);

      agreeBtn.addEventListener('click', function() {
        warningOverlay.classList.add('hidden');
        setTimeout(function() {
          warningOverlay.style.display = 'none';
          turnstileGate.classList.add('active');
        }, 500);
      });
    })();

    // =========================================
    // Turnstile
    // =========================================
    var turnstileWidgetId = null;

    window.onTurnstileReady = function() {
      var container = document.getElementById('turnstile-widget-debug');
      if (!container || !window.turnstile) return;
      turnstileWidgetId = window.turnstile.render(container, {
        sitekey: SITEKEY,
        theme: 'dark',
        callback: onTurnstilePass
      });
    };

    function onTurnstilePass(token) {
      document.getElementById('turnstileGate').classList.remove('active');
      document.getElementById('turnstileGate').style.display = 'none';
      document.getElementById('shellContainer').classList.add('active');
      document.getElementById('shellInput').focus();
      initShell();
    }

    // =========================================
    // Token 管理
    // =========================================
    // ⭐ 优先复用全站 AuthGuard（与主站共享同一个 auth_token，含 TTL / JWT exp 兜底）；
    //    只有 config.js 没加载成功时才退回本页的旧实现。
    function getToken() {
      try {
        if (window.AuthGuard && typeof window.AuthGuard.getToken === 'function') {
          return window.AuthGuard.getToken();
        }
      } catch(e) { /* 落到下面的兜底 */ }
      try {
        var data = JSON.parse(localStorage.getItem(TOKEN_KEY));
        if (!data) return null;
        if (Date.now() - data.timestamp > data.expiresIn) {
          localStorage.removeItem(TOKEN_KEY);
          return null;
        }
        return data.token;
      } catch(e) { return null; }
    }

    function setToken(token, expiresInSec) {
      try {
        if (window.AuthGuard && typeof window.AuthGuard.setToken === 'function') {
          window.AuthGuard.setToken(token, expiresInSec);
          return;
        }
      } catch(e) { /* 落到下面的兜底 */ }
      localStorage.setItem(TOKEN_KEY, JSON.stringify({
        token: token,
        timestamp: Date.now(),
        expiresIn: expiresInSec * 1000
      }));
    }

    function clearToken() {
      try {
        if (window.AuthGuard && typeof window.AuthGuard.clearToken === 'function') {
          window.AuthGuard.clearToken();
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
      } catch(e) {
        try { localStorage.removeItem(TOKEN_KEY); } catch(e2) {}
      }
      currentUser = null;
    }

    function getPermFromToken() {
      var raw = getToken();
      if (!raw) return { level: 0, context: null, nodes: [] };
      try {
        var parts = raw.split('.');
        if (parts.length < 2) return { level: 0, context: null, nodes: [] };
        var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var payload = JSON.parse(atob(b64));
        return payload.now_permission || { level: 0, context: null, nodes: [] };
      } catch(e) {
        return { level: 0, context: null, nodes: [] };
      }
    }

    // =========================================
    // Shell 核心
    // =========================================
    var shellOutput, shellInput, inputPrompt;
    var history = [];
    var historyIdx = -1;
    var cmdHistory = [];
    var loggedIn = false;
    var pendingPassword = false;
    var pendingUsername = null;
    var cmdQueue = [];

    var shellBound = false;
    var HISTORY_KEY = 'debug_shell_history';
    var SHELL_THEME_KEY = 'debug_shell_theme';

    function initShell() {
      shellOutput = document.getElementById('shellOutput');
      shellInput = document.getElementById('shellInput');
      inputPrompt = document.getElementById('inputPrompt');

      initShellTheme();
      loadHistory();
      updateStatus();
      printBanner();

      // ⚠️ 只绑定一次：exit → 重新过 Turnstile → initShell 会再次调用，
      //    重复绑定会让一条命令被执行两次。
      if (shellBound) return;
      shellBound = true;

      shellInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var cmd = shellInput.value.trim();
          shellInput.value = '';
          if (cmd) {
            cmdHistory.push(cmd);
            if (cmdHistory.length > 200) cmdHistory.shift();
            saveHistory();
            historyIdx = cmdHistory.length;
            processCommand(cmd);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyIdx > 0) {
            historyIdx--;
            shellInput.value = cmdHistory[historyIdx] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIdx < cmdHistory.length - 1) {
            historyIdx++;
            shellInput.value = cmdHistory[historyIdx] || '';
          } else {
            historyIdx = cmdHistory.length;
            shellInput.value = '';
          }
        } else if (e.key === 'Tab') {
          if (completeCommand()) e.preventDefault();
        } else if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
          e.preventDefault();
          cmdClear();
        }
      });

      var copyBtn = document.getElementById('copyOutputBtn');
      if (copyBtn) copyBtn.addEventListener('click', copyOutput);
      var clearBtn = document.getElementById('clearBtn');
      if (clearBtn) clearBtn.addEventListener('click', function() { cmdClear(); });

      // 每 30 秒刷新一次连接状态（token 可能在其他标签页里过期 / 被清除）
      setInterval(updateStatus, 30000);

      // 检查是否已有 token
      var token = getToken();
      if (token) {
        loggedIn = true;
        updatePrompt();
        printLine('[i] 检测到已有登录会话（与主站共用 AuthGuard），可使用 whoami 查看当前用户信息。', 'info');
      }
    }

    /** 命令名补全（只补第一个词；多个候选时列出并补到公共前缀） */
    function completeCommand() {
      var value = shellInput.value;
      if (!value || value.indexOf(' ') >= 0) return false;
      var matches = builtinCommands.filter(function(c) { return c.indexOf(value) === 0; });
      if (!matches.length) return false;
      if (matches.length === 1) {
        shellInput.value = matches[0] + ' ';
      } else {
        printLine(matches.join('   '), 'dim');
        var common = matches[0];
        matches.forEach(function(m) {
          while (common && m.indexOf(common) !== 0) common = common.slice(0, -1);
        });
        shellInput.value = common;
      }
      return true;
    }

    function loadHistory() {
      try {
        var saved = JSON.parse(localStorage.getItem(HISTORY_KEY));
        if (Array.isArray(saved)) {
          cmdHistory = saved.filter(function(x) { return typeof x === 'string'; }).slice(-200);
          historyIdx = cmdHistory.length;
        }
      } catch (e) { /* 历史记录失败不影响终端 */ }
    }

    function saveHistory() {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(cmdHistory.slice(-200))); } catch (e) {}
    }

    function initShellTheme() {
      var saved = 'dark';
      try { saved = localStorage.getItem(SHELL_THEME_KEY) || 'dark'; } catch (e) {}
      document.body.classList.toggle('light', saved === 'light');
    }

    function applyShellTheme(name) {
      var light = name === 'light';
      document.body.classList.toggle('light', light);
      try { localStorage.setItem(SHELL_THEME_KEY, light ? 'light' : 'dark'); } catch (e) {}
      printLine('终端主题已切换为: ' + (light ? 'light（浅色）' : 'dark（深色）'), 'ok');
    }

    /** 复制终端全部文本输出（优先 Clipboard API，失败退回 textarea + execCommand） */
    function copyOutput() {
      if (!shellOutput) return;
      var text = shellOutput.innerText || shellOutput.textContent || '';
      if (!text.trim()) { printLine('终端还没有输出。', 'warn'); return; }
      function done() { printLine('已复制终端输出（' + text.length + ' 字符）', 'ok'); }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', 'readonly');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) done();
        else printLine('复制失败：浏览器不允许访问剪贴板，请手动选择文本。', 'warn');
      } catch (e) {
        printLine('复制失败: ' + e.message, 'err');
      }
    }

    function updateStatus() {
      var dot = document.getElementById('statusDot');
      var text = document.getElementById('statusText');
      var token = getToken();
      if (token) {
        dot.className = 'dot online';
        text.textContent = 'authenticated';
      } else {
        dot.className = 'dot offline';
        text.textContent = 'disconnected';
      }
    }

    function updatePrompt() {
      var perm = getPermFromToken();
      var level = perm.level || 0;
      if (loggedIn) {
        inputPrompt.textContent = 'gwl@debug:' + level + '$';
      } else {
        inputPrompt.textContent = '$';
      }
    }

    function printBanner() {
      printLine('');
      printLine('╔══════════════════════════════════════════╗', 'ok');
      printLine('║     GWL Debug Shell v' + SHELL_VERSION + '                ║', 'ok');
      printLine('║  help · Tab 补全 · ↑↓ 历史 · selftest     ║', 'ok');
      printLine('╚══════════════════════════════════════════╝', 'ok');
      printLine('提示：终端与主站共用登录态（AuthGuard），无需重复登录。', 'dim');
      printLine('');
    }

    function printLine(text, className) {
      if (!shellOutput) return;
      var div = document.createElement('div');
      div.className = 'shell-line';
      if (className) {
        div.innerHTML = '<span class="' + className + '">' + escapeHtml(text) + '</span>';
      } else {
        div.textContent = text;
      }
      shellOutput.appendChild(div);
      shellOutput.scrollTop = shellOutput.scrollHeight;
    }

    function printJSON(obj) {
      var text;
      try {
        text = JSON.stringify(obj, null, 2);
      } catch(e) {
        text = String(obj);
      }
      printLine(text, 'json');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function printCmd(cmd) {
      var div = document.createElement('div');
      div.className = 'shell-line';
      div.innerHTML = '<span class="prompt">' + escapeHtml(inputPrompt.textContent) + '</span> <span class="cmd">' + escapeHtml(cmd) + '</span>';
      shellOutput.appendChild(div);
      shellOutput.scrollTop = shellOutput.scrollHeight;
    }

    // =========================================
    // 命令处理
    // =========================================
    function processCommand(input) {
      printCmd(input);

      // 密码输入模式
      if (pendingPassword) {
        handlePasswordInput(input);
        return;
      }

      var parts = input.trim().split(/\s+/);
      var cmd = parts[0] ? parts[0].toLowerCase() : '';
      var args = parts.slice(1);

      switch (cmd) {
        case 'help':     cmdHelp(args); break;
        case 'health':   cmdHealth(args); break;
        case 'status':   cmdHealth(args); break;
        case 'selftest': cmdSelfTest(); break;
        case 'about':    cmdAbout(); break;
        case 'open':     cmdOpen(args); break;
        case 'history':  cmdHistoryList(args); break;
        case 'copy':     cmdCopy(); break;
        case 'login':    cmdLogin(args); break;
        case 'logout':   cmdLogout(); break;
        case 'whoami':   cmdWhoami(); break;
        case 'clear':    cmdClear(); break;
        case 'echo':     cmdEcho(args); break;
        case 'date':     cmdDate(); break;
        case 'token':    cmdToken(); break;
        case 'perm':     cmdPerm(args); break;
        case 'switch':   cmdSwitch(args); break;
        case 'theme':    cmdTheme(args); break;
        case 'doc':      cmdDoc(args); break;
        case 'notify':   cmdNotify(args); break;
        case 'user':     cmdUser(args); break;
        case 'admin':    cmdAdmin(args); break;
        case 'exit':     cmdExit(); break;
        case '':         break;
        default:
          printLine('未知命令: ' + cmd + '。输入 help 查看可用命令。', 'err');
      }

      updateStatus();
      updatePrompt();
    }

    function handlePasswordInput(input) {

      var username = pendingUsername;
      pendingUsername = null;
      pendingPassword = false;
      shellInput.type = 'text';
      shellInput.placeholder = '输入 help 查看命令列表';

      doLogin(username, password);

    async function doLogin(username, password) {
      printLine('正在登录...', 'dim');
      try {
        // 获取 Turnstile token（如果 widget 可见）
        var cfToken = '';
        try {
          if (window.turnstile && turnstileWidgetId) {
            cfToken = window.turnstile.getResponse(turnstileWidgetId) || '';
          }
        } catch(e) {}

        var r = await fetch(API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, cf_turnstile_token: cfToken })
        });
        var d = await r.json();
        if (d.code === 200 && d.data && d.data.access_token) {
          setToken(d.data.access_token, d.data.expires_in || 86400);
          loggedIn = true;
          currentUser = { username: username };
          // 与主站共享同一个运行时权限对象（index.js / document.js 读 window.__nowPermission）
          if (d.data.now_permission) window.__nowPermission = d.data.now_permission;
          printLine('登录成功！欢迎, ' + username, 'ok');
          updatePrompt();
          updateStatus();
        } else {
          printLine('登录失败: ' + (d.msg || '未知错误'), 'err');
        }
      } catch(e) {
        printLine('网络错误: ' + e.message, 'err');
        printLine('提示：后端服务可能已离线，请在服务恢复后重试。', 'warn');
      }
    }

        try {

            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          var d = await r.json();
          printLine('后端登出: ' + (d.msg || 'ok'), 'dim');

        loggedIn = false;
        currentUser = null;
        window.__nowPermission = null;
        updatePrompt();
        updateStatus();
        printLine('已退出登录。', 'ok');
      })();

    // ===== token =====
    function cmdToken() {
      var token = getToken();
      if (!token) {
        printLine('无 Token（未登录）', 'warn');
        return;
      }
      printLine('Token: ' + token.substring(0, 40) + '...', 'dim');
      try {
        var parts = token.split('.');
        var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var payload = JSON.parse(atob(b64));
        printLine('Payload:', 'info');
        printJSON(payload);
      } catch(e) {
        printLine('Payload 解析失败', 'err');
      }
    }

    // ===== switch =====
    function cmdSwitch(args) {
      if (!requireAuth()) return;
      if (args.length === 0) {
        printLine('用法: switch <level> (1-5)', 'err');
        return;
      }
      var level = parseInt(args[0]);
      if (isNaN(level) || level < 1 || level > 5) {
        printLine('等级必须为 1-5 之间的整数', 'err');
        return;
      }
      (async function() {
        try {
          var token = getToken();
          var r = await fetch(API_BASE + '/auth/switch-permission', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_level: level })
          });
          var d = await r.json();
          if (d.code === 200) {
            // ⚠️ 后端返回的键是 access_token（不是 token）；旧写法读 d.data.token
            //    会恒为 undefined → 打印“切换成功”但 token 没换（权限看着没变）。
            if (d.data && d.data.access_token) {
              var oldToken = getToken();
              setToken(d.data.access_token, d.data.expires_in || 86400);
              // 清除旧 token 的黑名单记录（尽力而为）
              try {
                await fetch(API_BASE + '/auth/logout', {
                  method: 'POST',
                  headers: { 'Authorization': 'Bearer ' + oldToken }
                });
              } catch(e) {}
              printLine('权限已切换至 Lv' + level + '，Token 已刷新', 'ok');
            } else {
              printLine('权限切换成功（后端未返回新 token）', 'warn');
            }
            if (d.data && d.data.now_permission) window.__nowPermission = d.data.now_permission;
            updatePrompt();
            updateStatus();
          } else {
            printLine('切换失败: ' + (d.msg || '权限不足'), 'err');
          }
        } catch(e) {
          printLine('网络错误: ' + e.message, 'err');
        }
      })();
    }

    // ===== health / status =====
    function cmdHealth() {
      printLine('探测后端: GET ' + API_BASE + '/discover/sections', 'dim');
      var started = Date.now();
      var ctl = null;
      try { ctl = new AbortController(); } catch (e) { ctl = null; }
      var timer = setTimeout(function() { if (ctl) { try { ctl.abort(); } catch (e) {} } }, 5000);
      (async function() {
        try {
          var r = await fetch(API_BASE + '/discover/sections', {
            headers: { 'Accept': 'application/json' },
            signal: ctl ? ctl.signal : undefined
          });
          clearTimeout(timer);
          var ms = Date.now() - started;
          var d = null;
          try { d = await r.json(); } catch (e) {}
          if (r.ok && d && d.code === 200) {
            var n = d.data && Array.isArray(d.data.sections) ? d.data.sections.length : 0;
            printLine('✅ 后端可达 · HTTP ' + r.status + ' · ' + ms + 'ms · 板块 ' + n + ' 个', 'ok');
          } else {
            printLine('⚠️ 后端有响应但状态异常 · HTTP ' + r.status + ' · ' + ms + 'ms', 'warn');
            if (d) printJSON(d);
          }
        } catch (e) {
          clearTimeout(timer);
          printLine('❌ 后端不可达（' + (Date.now() - started) + 'ms）: ' + (e.name === 'AbortError' ? '超时（5s）' : e.message), 'err');
          printLine('提示：跨域 / 网络 / 后端进程都可能；主站其余页面能打开不代表 API 正常。', 'dim');
        }
      })();
    }

    function cmdSelfTest() {
      printLine('');

      var lines = [];
      function mark(ok, label, detail) {
        printLine((ok ? '✅ ' : '❌ ') + label + (detail ? ' — ' + detail : ''), ok ? 'ok' : 'err');
      }
      // 1. 共享配置
      mark(typeof BASE_PATH === 'string', '共享配置 BASE_PATH', typeof BASE_PATH === 'string' ? BASE_PATH : '未定义（config.js 未加载）');
      mark(typeof API_BASE === 'string' && API_BASE.indexOf('/api/v0') > 0, 'API_BASE', API_BASE);
      // 2. 登录态
      var token = getToken();
      mark(!!token, '登录态（AuthGuard）', token ? '已登录' : '未登录');
      var perm = getPermFromToken();
      printLine('  权限等级: Lv' + (perm.level != null ? perm.level : '?') + ' · 上下文: ' + (perm.context || '无') + ' · 节点: ' + ((perm.nodes || []).length), 'dim');
      // 3. localStorage
      var lsOk = false;
      try { localStorage.setItem('__debug_probe', '1'); lsOk = localStorage.getItem('__debug_probe') === '1'; localStorage.removeItem('__debug_probe'); } catch (e) {}
      mark(lsOk, 'localStorage 可读写');
      // 4. 主题
      printLine('  终端主题: ' + (document.body.classList.contains('light') ? 'light' : 'dark'), 'dim');
      // 5. Turnstile
      mark(!!(window.turnstile && window.turnstile.getResponse), 'Turnstile SDK', window.turnstile ? '已加载' : '未加载');
      // 6. Clipboard
      mark(!!(navigator.clipboard && navigator.clipboard.writeText), '剪贴板 API', navigator.clipboard ? '可用' : '不可用（copy 会退回 execCommand）');
      printLine('');
      printLine('自检完成。后端连通性请用 health 命令。', 'dim');
    }

    //    函数声明会被 `var cmdHistory = []` 覆盖成数组，调用时直接 TypeError。
    function cmdHistoryList(args) {
      var n = parseInt(args[0], 10);
      if (!isFinite(n) || n <= 0) n = 20;
      n = Math.min(n, 200);
      if (!cmdHistory.length) { printLine('还没有命令历史。', 'warn'); return; }
      var start = Math.max(0, cmdHistory.length - n);
      printLine('最近 ' + (cmdHistory.length - start) + ' 条命令（共 ' + cmdHistory.length + ' 条）：', 'info');
      for (var i = start; i < cmdHistory.length; i++) {
        printLine('  ' + (i + 1) + '  ' + cmdHistory[i], 'dim');
      }
    }

      switch (sub) {

          apiGet('/admin/documents', '文档管理列表', true);
          break;
        case 'notify':
          apiGet('/admin/notifications', '通知管理列表', true);

        case 'perm':

          (function() {
            var scope = prompt('scope (level/user/group/content):', 'level');
            if (!scope) return;
            var url = '/admin/permission-rules?scope=' + encodeURIComponent(scope);
            if (scope === 'content') {
              var ot = prompt('object_type (document/folder/menu):', 'document');
              if (!ot) return;
              var oid = prompt('object_id:', '1');
              if (oid === null) return;
              url += '&object_type=' + encodeURIComponent(ot) + '&id=' + encodeURIComponent(oid);
            } else {
              var sid = prompt('scope_id（留空查全部）:', '');
              if (sid === null) return;
              if (sid) url += '&id=' + encodeURIComponent(sid);
            }
            apiGet(url, '权限规则 (permission-rules)', true);
          })();
          break;
        default:
          printLine('用法: admin <users|search|stats|menu|nodes|invites|groups|docs|notify|perm>', 'err');
      }
    }

    // =========================================
    // API 请求辅助
    // =========================================
    function requireAuth() {
      if (!getToken()) {
        printLine('请先登录。使用 login <username> 命令。', 'err');
        return false;
      }
      return true;
    }

    function getHeaders(withAdmin) {
      var headers = { 'Authorization': 'Bearer ' + getToken() };
      if (withAdmin) { headers['X-Permission-Context'] = 'admin'; }
      return headers;
    }

    function apiGet(path, label, withAdmin) {
      printLine('请求: GET ' + path, 'dim');
      (async function() {
        try {
          var r = await fetch(API_BASE + path, { headers: getHeaders(withAdmin) });
          var d = await r.json();
          if (d.code === 200) {
            printLine('✅ ' + label + ' 成功', 'ok');
            printJSON(d.data || d.msg);
          } else if (d.code === 403) {
            printLine('❌ 权限不足 (403): ' + (d.msg || '无权限访问'), 'err');
          } else {
            printLine('⚠️ ' + label + ': ' + (d.msg || '未知错误'), 'warn');
            printJSON(d);
          }
        } catch(e) {
          printLine('❌ 请求失败（后端可能离线）: ' + e.message, 'err');
        }
      })();
    }

    function apiPost(path, body, label) {
      printLine('请求: POST ' + path, 'dim');
      (async function() {
        try {
          var r = await fetch(API_BASE + path, {
            method: 'POST',
            headers: getHeaders(true),
            body: JSON.stringify(body)
          });
          var d = await r.json();
          if (d.code === 200) {
            printLine('✅ ' + label + ' 成功', 'ok');
            printJSON(d.data || d.msg);
          } else {
            printLine('⚠️ ' + label + ': ' + (d.msg || '失败'), 'warn');
            printJSON(d);
          }
        } catch(e) {
          printLine('❌ 请求失败: ' + e.message, 'err');
        }
      })();
    }

    function apiPut(path, body, label) {
      printLine('请求: PUT ' + path, 'dim');
      (async function() {
        try {
          var r = await fetch(API_BASE + path, {
            method: 'PUT',
            headers: getHeaders(false),
            body: JSON.stringify(body)
          });
          var d = await r.json();
          if (d.code === 200) {
            printLine('✅ ' + label + ' 成功', 'ok');
            printJSON(d.data || d.msg);
          } else {
            printLine('⚠️ ' + label + ': ' + (d.msg || '失败'), 'warn');
            printJSON(d);
          }
        } catch(e) {
          printLine('❌ 请求失败: ' + e.message, 'err');
        }
      })();
    }

    // =========================================
    // 容错：页面即使后端崩溃也能加载
    // =========================================
    // 此页面是静态 HTML，由 Nginx/GitHub Pages 直接托管
    // 即使 Flask 后端 (app.py) 崩溃，页面本身仍可正常加载
    // 所有 API 调用均有 try-catch 保护，后端离线时仅显示错误提示
    // 终端交互（help/clear/echo/date/theme 等本地命令）完全不受影响
  </script>
</body>
</html>
