<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级管理员 | GWL</title>
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <div id="bootLoading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#666;font-family:system-ui,-apple-system,sans-serif;">
        正在加载一级管理员界面...
    </div>
    <script>
    (async function () {
        try {
            const res = await fetch('../user/dashboard.html', { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');

            // 在 head 最前面插入 <base>，让 user/dashboard.html 中的相对路径
            // (./../css/, ./dashboard.css, ./../js/, ./dashboard.js) 都相对于 ../user/ 解析
            document.head.innerHTML = '<base href="../user/">' + doc.head.innerHTML;
            document.title = '一级管理员 | GWL';

            // 替换 body 内容
            document.body.innerHTML = doc.body.innerHTML;

            // innerHTML 复制的 <script> 不会执行，需手动重建
            // 修复：用 getAttribute('src') 取原始字符串，让浏览器按 <base href> 重新解析
            // （oldScript.src 是 DOMParser 基于 adminN 路径解析的绝对 URL，会错误指向 adminN/dashboard.js）
            doc.querySelectorAll('script').forEach(oldScript => {
                const s = document.createElement('script');
                const rawSrc = oldScript.getAttribute('src');
                if (rawSrc) {
                    s.src = rawSrc;
                    s.async = false; // 保证按插入顺序执行（config.js → ... → dashboard.js）
                } else {
                    s.textContent = oldScript.textContent;
                }
                document.body.appendChild(s);
            });

            // 注入本等级专属 JS（adminN/dashboard.js），用 location.pathname 构造绝对路径避免 base href 干扰
            const adminJs = document.createElement('script');
            adminJs.src = window.location.pathname.replace(/\/dashboard\.html$/, '/dashboard.js');
            adminJs.async = false;
            document.body.appendChild(adminJs);
        } catch (e) {
            console.error('[admin1] 加载 dashboard 失败:', e);
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:8px;color:#c00;font-family:system-ui,sans-serif;"><p>加载失败</p><p style="font-size:0.85rem;color:#666;">' + (e.message || '未知错误') + '</p><a href="../user/dashboard.html" style="color:#2563eb;">前往用户主页</a></div>';
        }
    })();
    </script>
</body>
</html>
