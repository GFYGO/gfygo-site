<div class="admin-page" data-tab="admin-stats">
    <h2>📊 仪表盘</h2>
    <div class="stats-layout">
        <div class="stats-left">
            <div class="stats-card">
                <span class="stats-value" id="stat-user-count">--</span>
                <span class="stats-label">用户总数</span>
            </div>
            <div class="stats-card">
                <span class="stats-value" id="stat-doc-count">--</span>
                <span class="stats-label">文档总数</span>
            </div>
            <div class="stats-card">
                <span class="stats-value" id="stat-view-count">--</span>
                <span class="stats-label">总浏览量</span>
            </div>
            <div class="stats-card">
                <span class="stats-value" id="stat-today-users">--</span>
                <span class="stats-label">今日新增</span>
            </div>
        </div>
        <div class="stats-right">
            <div class="chart-box">
                <h3>📈 近7天注册趋势</h3>
                <canvas id="chart-registrations" width="400" height="180"></canvas>
            </div>
            <div class="chart-box">
                <h3>📝 近7天文档创建</h3>
                <canvas id="chart-documents" width="400" height="180"></canvas>
            </div>
            <div class="chart-box">
                <h3>🥧 权限等级分布</h3>
                <canvas id="chart-levels" width="400" height="180"></canvas>
            </div>
        </div>
    </div>
    
</div>
