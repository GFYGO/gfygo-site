<div class="admin-page" data-tab="docs">
    <!-- 面包屑路径 -->
    <div class="pdocs-breadcrumb" id="pdocsPathBreadcrumb"></div>

    <!-- 文档列表视图 -->
    <div class="pdocs-view" id="pdocs-view-list">
        <div class="pdocs-toolbar">
            <h2 class="panel-title">个人文档</h2>
            <div class="pdocs-toolbar-actions">
                <button class="pdocs-btn pdocs-btn--secondary" id="pdocsUpBtn" title="返回上一级">↑ 返回上一级</button>
                <button class="pdocs-btn pdocs-btn--secondary" id="pdocsFolderAddBtn" title="新建文件夹">📁 新建文件夹</button>
                <button class="pdocs-btn pdocs-btn--primary" id="pdocsNewBtn">+ 新建文档</button>
                <div class="pdocs-dropdown" id="pdocsImportDropdown">
                    <button class="pdocs-btn pdocs-btn--secondary" id="pdocsImportBtn" type="button">📥 导入</button>
                    <div class="pdocs-dropdown__menu" id="pdocsImportMenu">
                        <button class="pdocs-dropdown__item" id="pdocsImportMdBtn" type="button">📄 导入 .md 文件</button>
                        <div class="pdocs-dropdown__divider"></div>
                        <div class="pdocs-dropdown__hint">将 Markdown 文档导入为私有文档，格式支持：.md / .markdown</div>
                    </div>
                </div>
                <button class="pdocs-btn pdocs-btn--secondary" id="pdocsTrashBtn">🗑 回收站</button>
            </div>
        </div>
        <input type="file" id="pdocsImportFileInput" accept=".md,.markdown,text/markdown,text/plain" style="display:none;">
        <div class="pdocs-explorer-grid" id="pdocsListContainer">
            <p class="loading-text">加载中...</p>
        </div>
    </div>

    <!-- 浏览视图 -->
    <div class="pdocs-view" id="pdocs-view-browse" style="display: none;">
        <div class="pdocs-browser-toolbar">
            <button class="pdocs-btn pdocs-btn--secondary" id="pdocsBrowserBackBtn">← 返回列表</button>
            <div class="pdocs-browser-titlebar" id="pdocsBrowserTitlebar">
                <span class="pdocs-browser-icon" id="pdocsBrowserIcon">📄</span>
                <span class="pdocs-browser-title" id="pdocsBrowserTitle">加载中...</span>
            </div>
            <div class="pdocs-browser-actions">
                <button class="pdocs-btn pdocs-btn--ghost" id="pdocsBrowserOpenInDocBtn" title="在文档中心打开">🔗 外部打开</button>
                <button class="pdocs-btn pdocs-btn--secondary" id="pdocsBrowserEditBtn">✏️ 编辑</button>
                <button class="pdocs-btn pdocs-btn--danger" id="pdocsBrowserDeleteBtn">🗑 删除</button>
            </div>
        </div>
        <div class="pdocs-browser-meta" id="pdocsBrowserMeta"></div>
        <div class="pdocs-browser-body">
            <div id="pdocsBrowserContent" class="pdocs-browser-content markdown-body"></div>
        </div>
    </div>

    <!-- 编辑器视图 -->
    <div class="pdocs-view" id="pdocs-view-editor" style="display: none;">
        <div class="pdocs-editor-toolbar">
            <button class="pdocs-btn pdocs-btn--secondary" id="pdocsBackBtn">← 返回</button>
            <input type="text" class="pdocs-title-input" id="pdocsTitleInput" placeholder="文档标题" maxlength="200">
            <button class="pdocs-btn pdocs-btn--ghost" id="pdocsPreviewToggleBtn">👁 预览</button>
            <button class="pdocs-btn pdocs-btn--primary" id="pdocsSaveBtn">💾 保存</button>
        </div>
        <div class="pdocs-editor-body">
            <textarea class="pdocs-content-input" id="pdocsContentInput" placeholder="使用 Markdown 编写文档..."></textarea>
            <div class="pdocs-preview" id="pdocsPreview" style="display: none;"></div>
        </div>
    </div>

    <!-- 回收站视图 -->
    <div class="pdocs-view" id="pdocs-view-trash" style="display: none;">
        <div class="pdocs-toolbar">
            <h2 class="panel-title">回收站</h2>
            <div class="pdocs-toolbar-actions">
                <button class="pdocs-btn pdocs-btn--secondary" id="pdocsTrashBackBtn">← 返回文档列表</button>
            </div>
        </div>
        <div class="pdocs-trash-list" id="pdocsTrashContainer">
            <p class="loading-text">加载中...</p>
        </div>
    </div>
</div>
