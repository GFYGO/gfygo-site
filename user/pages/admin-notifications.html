<div class="admin-page" data-tab="admin-notifications">
    <h2>📢 通知管理</h2>
    <div id="notifyFormWrap">
        <form id="notifyForm" class="admin-form">
            <div class="form-row">
                <label>标题</label>
                <input type="text" name="title" placeholder="系统通知" style="max-width:300px">
            </div>
            <div class="form-row">
                <label>可见等级</label>
                <div class="perm-checks">
                    <label><input type="checkbox" name="perm" value="0"> Guest</label>
                    <label><input type="checkbox" name="perm" value="1" checked> Lv1</label>
                    <label><input type="checkbox" name="perm" value="2" checked> Lv2</label>
                    <label><input type="checkbox" name="perm" value="3" checked> Lv3</label>
                    <label><input type="checkbox" name="perm" value="4" checked> Lv4</label>
                    <label><input type="checkbox" name="perm" value="5" checked> Lv5</label>
                </div>
            </div>
            <div class="form-row">
                <label>权限节点(逗号分隔)</label>
                <input type="text" name="visible_permission_nodes" placeholder="如 admin.stats.view,admin.menu.view" style="max-width:400px">
            </div>
            <div class="form-row">
                <label>生效时段</label>
                <input type="datetime-local" name="start_time">
                <span>至</span>
                <input type="datetime-local" name="end_time">
            </div>
            <div class="form-row">
                <label>内容</label>
                <textarea name="content" rows="4" placeholder="输入通知内容..."></textarea>
            </div>
            <div class="form-row">
                <label></label>
                <button type="submit" class="btn btn-primary">发布通知</button>
                <button type="button" id="resetBtn" class="btn btn-secondary">重置</button>
            </div>
        </form>
    </div>
    <div class="admin-list-header">
        <h3>通知列表</h3>
        <button id="refreshNotifyBtn" class="btn btn-secondary btn-sm">刷新</button>
    </div>
    <table class="admin-table" id="notifyTable">
        <thead>
            <tr><th>ID</th><th>标题</th><th>内容</th><th>等级</th><th>生效时间</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody id="notifyTbody"></tbody>
    </table>
    
</div>
