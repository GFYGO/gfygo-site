<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | GWL</title>
    <link rel="stylesheet" href="./../styles.css">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="dashboard-sidebar" id="dashboardSidebar">
            <div class="sidebar__header">
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">&times;</button>
                <div class="sidebar__logo">GWL</div>
            </div>

            <nav class="sidebar__nav">
                <a href="#" class="sidebar__nav-item active" data-tab="workbench">
                    <span class="sidebar__nav-icon">💼</span>
                    <span class="sidebar__nav-text">工作台</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <a href="#" class="sidebar__user-link" id="sidebarUserLink">
                    <div class="sidebar__avatar">
                        <img id="sidebarAvatar" src="./../favicon.png" alt="Avatar">
                    </div>
                    <div class="sidebar__user-info">
                        <span class="sidebar__username" id="sidebarUsername">加载中...</span>
                        <span class="sidebar__user-role" id="sidebarUserRole">--</span>
                    </div>
                </a>
                <button class="sidebar__settings-btn" id="settingsBtn" aria-label="设置">
                    ⚙️
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <button class="dashboard-header__menu-btn" id="menuToggle" aria-label="菜单">☰</button>
                <nav class="dashboard-header__nav header__nav" id="dashboardNav">
                    <a href="./../index.html">首页</a>
                    <a href="./../document.html">文档</a>
                    <a href="./../login.html">登录</a>
                    <a href="./../register.html">注册</a>
                </nav>
                <div class="dashboard-header__right">
                    <div id="global-notifications-container" class="notification-toast"></div>
                    <div id="auth-container"></div>
                    <div class="permission-buttons" id="permissionButtons"></div>
                </div>
            </header>

            <div class="dashboard-content">
                <section class="workbench-section">
                    <div class="workbench-empty">
                        <div class="workbench-empty__icon">💼</div>
                        <h2 class="workbench-empty__title">工作台</h2>
                        <p class="workbench-empty__desc">功能开发中，敬请期待</p>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer__container">
                    <div class="footer__top">
                        <div class="footer__brand">
                            <h3 class="footer__logo">GWL Works Lab</h3>
                            <p class="footer__slogan">探索学习的无限可能</p>
                        </div>
                        <div class="footer__links">
                            <div class="footer__links-group">
                                <h4>快速链接</h4>
                                <a href="./../index.html">首页</a>
                                <a href="./../document.html">文档</a>
                                <a href="./../login.html">登录</a>
                            </div>
                            <div class="footer__links-group">
                                <h4>关于</h4>
                                <a href="#">关于我们</a>
                                <a href="#">隐私政策</a>
                                <a href="#">服务条款</a>
                            </div>
                        </div>
                    </div>
                    <div class="footer__bottom">
                        <p>&copy; 2026 GFYGO. All rights reserved.</p>
                        <div class="footer__social">
                            <a href="#" aria-label="GitHub">GitHub</a>
                            <a href="#" aria-label="Bilibili">Bilibili</a>
                        </div>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./../config.js"></script>
    <script src="./../theme.js"></script>
    <script src="./../toast.js"></script>
    <script src="./../index.js"></script>
    <script src="./dashboard.js"></script>
</body>
</html>
