<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | GWL</title>
    <link rel="stylesheet" href="./../styles.css">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header__logo">GWL Works Lab</div>
        <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>
        <nav class="header__nav" id="headerNav">
            <a href="./../index.html">首页</a>
            <a href="./../document.html">文档</a>
        </nav>
        <div class="header__actions">
            <div id="auth-container"></div>
        </div>
    </header>

    <!-- 个人主页布局 -->
    <div class="profile-layout">
        <!-- 移动端遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 左侧侧边栏 -->
        <aside class="profile-sidebar" id="profileSidebar">
            <div class="profile-sidebar__top">
                <!-- 移动端关闭按钮 -->
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">&times;</button>
                <nav class="profile-nav">
                    <a href="#" class="profile-nav__item active">我的动态</a>
                    <a href="#" class="profile-nav__item">个人设置</a>
                    <a href="#" class="profile-nav__item">消息通知</a>
                </nav>
            </div>
            <div class="profile-sidebar__bottom">
                <div class="profile-avatar">
                    <img src="./../favicon.png" alt="Avatar">
                </div>
                <span class="profile-username">加载中...</span>
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="profile-content">
            <h1>我的动态</h1>
            <p class="text-muted mt-4">
                欢迎来到你的个人主页。左侧侧边栏使用 <code>position: sticky</code> 实现滚动冻结。<br>
                在移动端，点击左上角汉堡菜单展开抽屉式侧边栏。
            </p>
            <div class="content-placeholder">
                更多内容建设中...
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__container">
            <div class="footer__bottom" style="margin: 0 auto;">
                <p>&copy; 2026 GFYGO. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 主题切换悬浮按钮 -->
    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./../config.js"></script>
    <script src="./../theme.js"></script>
    <script src="./../toast.js"></script>
    <script src="./../index.js"></script>
    <script src="./dashboard.js"></script>
</body>
</html>
