<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 | GWL 管理后台</title>
    <link rel="stylesheet" href="./../styles.css">
    <link rel="stylesheet" href="./admin.css">
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar__header">
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">&times;</button>
                <div class="sidebar__logo">GWL 管理后台</div>
            </div>

            <nav class="sidebar__nav">
                <a href="#" class="sidebar__nav-item active" data-tab="user-manage">
                    <span class="sidebar__nav-icon">👥</span>
                    <span class="sidebar__nav-text">用户管理</span>
                </a>
                <a href="#" class="sidebar__nav-item" data-tab="permission-assign">
                    <span class="sidebar__nav-icon">🔐</span>
                    <span class="sidebar__nav-text">权限分配</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div class="sidebar__avatar">
                        <img id="sidebarAvatar" src="./../favicon.png" alt="Avatar">
                    </div>
                    <div class="sidebar__user-info">
                        <span class="sidebar__username" id="sidebarUsername">管理员</span>
                        <span class="sidebar__user-role" id="sidebarUserRole">用户管理员</span>
                    </div>
                </div>
                <a href="./../index.html" class="sidebar__back-btn" title="返回首页">
                    🏠
                </a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <button class="admin-header__menu-btn" id="menuToggle" aria-label="菜单">☰</button>
                <nav class="admin-header__nav header__nav" id="adminNav">
                    <a href="./../index.html">首页</a>
                    <a href="./../document.html">文档</a>
                </nav>
                <div class="admin-header__right">
                    <div id="global-notifications-container" class="notification-toast"></div>
                    <div id="auth-container"></div>
                </div>
            </header>

            <div class="admin-content">
                <!-- 用户管理模块 -->
                <section class="tab-panel" id="panel-user-manage" style="display: block;">
                    <div class="admin-toolbar">
                        <h2 class="panel-title">👥 用户管理</h2>
                        <div class="admin-toolbar-actions">
                            <input type="text" class="admin-search" id="userSearchInput" placeholder="搜索用户名/邮箱...">
                            <select class="admin-select" id="userRoleFilter">
                                <option value="">全部角色</option>
                                <option value="admin">管理员</option>
                                <option value="user">普通用户</option>
                                <option value="guest">访客</option>
                            </select>
                            <select class="admin-select" id="userStatusFilter">
                                <option value="">全部状态</option>
                                <option value="active">正常</option>
                                <option value="inactive">未激活</option>
                                <option value="banned">已封禁</option>
                            </select>
                        </div>
                    </div>
                    <div class="admin-table-container">
                        <table class="admin-table" id="userTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>头像</th>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>角色</th>
                                    <th>注册时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="8" class="admin-table__empty">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="admin-pagination" id="userPagination">
                        <button class="admin-pagination__btn" id="userPrevBtn" disabled>上一页</button>
                        <span class="admin-pagination__info" id="userPageInfo">第 1 页</span>
                        <button class="admin-pagination__btn" id="userNextBtn">下一页</button>
                    </div>
                </section>

                <!-- 权限分配模块 -->
                <section class="tab-panel" id="panel-permission-assign" style="display: none;">
                    <div class="admin-placeholder">
                        <div class="admin-placeholder__icon">🔐</div>
                        <h2 class="admin-placeholder__title">权限分配功能</h2>
                        <p class="admin-placeholder__text">权限分配功能正在开发中，敬请期待</p>
                        <p class="admin-placeholder__desc">该模块将支持细粒度的用户权限配置，包括文档访问、编辑、删除等权限的精确控制。</p>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer__container">
                    <div class="footer__bottom">
                        <p>&copy; 2026 GFYGO. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <!-- 编辑用户模态框 -->
    <div class="admin-modal" id="editUserModal" style="display: none;">
        <div class="admin-modal__overlay" id="editUserModalOverlay"></div>
        <div class="admin-modal__content">
            <div class="admin-modal__header">
                <h3 class="admin-modal__title">编辑用户信息</h3>
                <button class="admin-modal__close" id="editUserModalClose">&times;</button>
            </div>
            <div class="admin-modal__body">
                <div class="admin-form-group">
                    <label class="admin-form-label">用户名</label>
                    <input type="text" class="admin-form-input" id="editUsername" placeholder="输入用户名">
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">邮箱</label>
                    <input type="email" class="admin-form-input" id="editEmail" placeholder="输入邮箱">
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">角色</label>
                    <select class="admin-form-select" id="editRole">
                        <option value="admin">管理员</option>
                        <option value="user">普通用户</option>
                        <option value="guest">访客</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">状态</label>
                    <select class="admin-form-select" id="editStatus">
                        <option value="active">正常</option>
                        <option value="inactive">未激活</option>
                        <option value="banned">已封禁</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">个人简介</label>
                    <textarea class="admin-form-textarea" id="editBio" placeholder="个人简介..." rows="3"></textarea>
                </div>
            </div>
            <div class="admin-modal__footer">
                <button class="admin-btn admin-btn--secondary" id="editUserCancelBtn">取消</button>
                <button class="admin-btn admin-btn--primary" id="editUserSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认操作模态框 -->
    <div class="admin-modal" id="confirmModal" style="display: none;">
        <div class="admin-modal__overlay" id="confirmModalOverlay"></div>
        <div class="admin-modal__content admin-modal__content--sm">
            <div class="admin-modal__header">
                <h3 class="admin-modal__title" id="confirmModalTitle">确认操作</h3>
                <button class="admin-modal__close" id="confirmModalClose">&times;</button>
            </div>
            <div class="admin-modal__body">
                <p class="admin-modal__text" id="confirmModalText">确定要执行此操作吗？</p>
            </div>
            <div class="admin-modal__footer">
                <button class="admin-btn admin-btn--secondary" id="confirmCancelBtn">取消</button>
                <button class="admin-btn admin-btn--danger" id="confirmActionBtn">确认</button>
            </div>
        </div>
    </div>

    <script src="./../config.js"></script>
    <script src="./../theme.js"></script>
    <script src="./../toast.js"></script>
    <script src="./../modal.js"></script>
    <script src="./../index.js"></script>
    <script src="./base-template.js"></script>
    <script src="./admin.js"></script>
</body>
</html>
