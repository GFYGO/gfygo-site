<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档管理 | GWL 管理后台</title>
    <link rel="stylesheet" href="./../styles.css">
    <link rel="stylesheet" href="./admin.css">
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar__header">
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">&times;</button>
                <div class="sidebar__logo">GWL 管理后台</div>
            </div>

            <nav class="sidebar__nav">
                <a href="#" class="sidebar__nav-item active" data-tab="doc-manage">
                    <span class="sidebar__nav-icon">📄</span>
                    <span class="sidebar__nav-text">文档管理</span>
                </a>
                <a href="#" class="sidebar__nav-item" data-tab="folder-manage">
                    <span class="sidebar__nav-icon">📁</span>
                    <span class="sidebar__nav-text">文件夹管理</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div class="sidebar__avatar">
                        <img id="sidebarAvatar" src="./../favicon.png" alt="Avatar">
                    </div>
                    <div class="sidebar__user-info">
                        <span class="sidebar__username" id="sidebarUsername">管理员</span>
                        <span class="sidebar__user-role" id="sidebarUserRole">文档管理员</span>
                    </div>
                </div>
                <a href="./../index.html" class="sidebar__back-btn" title="返回首页">
                    🏠
                </a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <button class="admin-header__menu-btn" id="menuToggle" aria-label="菜单">☰</button>
                <nav class="admin-header__nav header__nav" id="adminNav">
                    <a href="./../index.html">首页</a>
                    <a href="./../document.html">文档</a>
                </nav>
                <div class="admin-header__right">
                    <div id="global-notifications-container" class="notification-toast"></div>
                    <div id="auth-container"></div>
                </div>
            </header>

            <div class="admin-content">
                <!-- 文档管理模块 -->
                <section class="tab-panel" id="panel-doc-manage" style="display: block;">
                    <div class="admin-toolbar">
                        <h2 class="panel-title">📄 公共文档管理</h2>
                        <div class="admin-toolbar-actions">
                            <input type="text" class="admin-search" id="docSearchInput" placeholder="搜索文档...">
                            <select class="admin-select" id="docFolderFilter">
                                <option value="">全部文件夹</option>
                            </select>
                        </div>
                    </div>
                    <div class="admin-table-container">
                        <table class="admin-table" id="docTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>标题</th>
                                    <th>所属文件夹</th>
                                    <th>作者</th>
                                    <th>创建时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="docTableBody">
                                <tr>
                                    <td colspan="7" class="admin-table__empty">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="admin-pagination" id="docPagination">
                        <button class="admin-pagination__btn" id="docPrevBtn" disabled>上一页</button>
                        <span class="admin-pagination__info" id="docPageInfo">第 1 页</span>
                        <button class="admin-pagination__btn" id="docNextBtn">下一页</button>
                    </div>
                </section>

                <!-- 文件夹管理模块 -->
                <section class="tab-panel" id="panel-folder-manage" style="display: none;">
                    <div class="admin-toolbar">
                        <h2 class="panel-title">📁 公共文件夹管理</h2>
                        <div class="admin-toolbar-actions">
                            <button class="admin-btn admin-btn--primary" id="createFolderBtn">+ 新建文件夹</button>
                        </div>
                    </div>
                    <div class="admin-table-container">
                        <table class="admin-table" id="folderTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>文件夹名称</th>
                                    <th>父文件夹</th>
                                    <th>文档数量</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="folderTableBody">
                                <tr>
                                    <td colspan="6" class="admin-table__empty">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer__container">
                    <div class="footer__bottom">
                        <p>&copy; 2026 GFYGO. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <!-- 编辑文档模态框 -->
    <div class="admin-modal" id="editDocModal" style="display: none;">
        <div class="admin-modal__overlay" id="editDocModalOverlay"></div>
        <div class="admin-modal__content">
            <div class="admin-modal__header">
                <h3 class="admin-modal__title">编辑文档</h3>
                <button class="admin-modal__close" id="editDocModalClose">&times;</button>
            </div>
            <div class="admin-modal__body">
                <div class="admin-form-group">
                    <label class="admin-form-label">文档标题</label>
                    <input type="text" class="admin-form-input" id="editDocTitle" placeholder="输入文档标题">
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">所属文件夹</label>
                    <select class="admin-form-select" id="editDocFolder">
                        <option value="">无（根目录）</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">文档内容</label>
                    <textarea class="admin-form-textarea" id="editDocContent" placeholder="输入文档内容..." rows="10"></textarea>
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">状态</label>
                    <select class="admin-form-select" id="editDocStatus">
                        <option value="published">已发布</option>
                        <option value="draft">草稿</option>
                        <option value="archived">已归档</option>
                    </select>
                </div>
            </div>
            <div class="admin-modal__footer">
                <button class="admin-btn admin-btn--secondary" id="editDocCancelBtn">取消</button>
                <button class="admin-btn admin-btn--primary" id="editDocSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 创建/编辑文件夹模态框 -->
    <div class="admin-modal" id="folderModal" style="display: none;">
        <div class="admin-modal__overlay" id="folderModalOverlay"></div>
        <div class="admin-modal__content">
            <div class="admin-modal__header">
                <h3 class="admin-modal__title" id="folderModalTitle">新建文件夹</h3>
                <button class="admin-modal__close" id="folderModalClose">&times;</button>
            </div>
            <div class="admin-modal__body">
                <div class="admin-form-group">
                    <label class="admin-form-label">文件夹名称</label>
                    <input type="text" class="admin-form-input" id="folderName" placeholder="输入文件夹名称">
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label">父文件夹（可选）</label>
                    <select class="admin-form-select" id="parentFolder">
                        <option value="">无（根目录）</option>
                    </select>
                </div>
            </div>
            <div class="admin-modal__footer">
                <button class="admin-btn admin-btn--secondary" id="folderCancelBtn">取消</button>
                <button class="admin-btn admin-btn--primary" id="folderSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="admin-modal" id="deleteConfirmModal" style="display: none;">
        <div class="admin-modal__overlay" id="deleteConfirmModalOverlay"></div>
        <div class="admin-modal__content admin-modal__content--sm">
            <div class="admin-modal__header">
                <h3 class="admin-modal__title">确认删除</h3>
                <button class="admin-modal__close" id="deleteConfirmModalClose">&times;</button>
            </div>
            <div class="admin-modal__body">
                <p class="admin-modal__text" id="deleteConfirmText">确定要删除吗？此操作不可恢复。</p>
            </div>
            <div class="admin-modal__footer">
                <button class="admin-btn admin-btn--secondary" id="deleteCancelBtn">取消</button>
                <button class="admin-btn admin-btn--danger" id="deleteConfirmBtn">删除</button>
            </div>
        </div>
    </div>

    <script src="./../config.js"></script>
    <script src="./../theme.js"></script>
    <script src="./../toast.js"></script>
    <script src="./../modal.js"></script>
    <script src="./../index.js"></script>
    <script src="./admin.js"></script>
</body>
</html>
