<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务管理 | GWL 管理后台</title>
    <link rel="stylesheet" href="./../styles.css">
    <link rel="stylesheet" href="./admin.css">
    <link rel="icon" href="./../favicon.png" type="image/png">
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar__header">
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">&times;</button>
                <div class="sidebar__logo">GWL 管理后台</div>
            </div>

            <nav class="sidebar__nav">
                <a href="#" class="sidebar__nav-item active" data-tab="finance-data">
                    <span class="sidebar__nav-icon">💰</span>
                    <span class="sidebar__nav-text">财务数据</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div class="sidebar__avatar">
                        <img id="sidebarAvatar" src="./../favicon.png" alt="Avatar">
                    </div>
                    <div class="sidebar__user-info">
                        <span class="sidebar__username" id="sidebarUsername">管理员</span>
                        <span class="sidebar__user-role" id="sidebarUserRole">财务管理员</span>
                    </div>
                </div>
                <a href="./../index.html" class="sidebar__back-btn" title="返回首页">
                    🏠
                </a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <button class="admin-header__menu-btn" id="menuToggle" aria-label="菜单">☰</button>
                <nav class="admin-header__nav header__nav" id="adminNav">
                    <a href="./../index.html">首页</a>
                    <a href="./../document.html">文档</a>
                </nav>
                <div class="admin-header__right">
                    <div id="global-notifications-container" class="notification-toast"></div>
                    <div id="auth-container"></div>
                </div>
            </header>

            <div class="admin-content">
                <!-- 财务数据模块 -->
                <section class="tab-panel" id="panel-finance-data" style="display: block;">
                    <div class="admin-placeholder admin-placeholder--large">
                        <div class="admin-placeholder__icon">💰</div>
                        <h2 class="admin-placeholder__title">财务管理功能</h2>
                        <p class="admin-placeholder__text">财务管理功能正在开发中，敬请期待</p>
                        <p class="admin-placeholder__desc">
                            该模块将支持以下功能：<br>
                            • 收支记录管理<br>
                            • 财务报表生成<br>
                            • 预算管理<br>
                            • 发票管理<br>
                            • 财务审批流程
                        </p>
                        <div class="admin-placeholder__badge">
                            <span class="admin-badge admin-badge--warning">开发中</span>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer__container">
                    <div class="footer__bottom">
                        <p>&copy; 2026 GFYGO. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./../config.js"></script>
    <script src="./../theme.js"></script>
    <script src="./../toast.js"></script>
    <script src="./../modal.js"></script>
    <script src="./../index.js"></script>
    <script src="./base-template.js"></script>
    <script src="./admin.js"></script>
</body>
</html>
