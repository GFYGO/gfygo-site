<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../../css/core.css?v=20261002a">
  <link rel="stylesheet" href="../../css/styles.css?v=20261002a">

<body data-discover-page="detail" data-discover-key="org">
  <!--
    「组织」详情页：读 ?id=<item_id>，按后端下发的 item.actions 渲染按钮（view + join，
    join 只弹预留提示、不发任何请求）。
    空态：id 缺失/非数字 → 「缺少展示内容 id」；404 → 「展示内容不存在或未公开」；
    网络失败 → 「加载失败，请稍后重试」（逻辑在 js/discover.js::loadDetail）。
    本页在 /discover/org/ 下（两层深）：静态资源前缀 ../../，window.BASE_PATH 也由 js/config.js 按 URL 目录深度算成 '../..'。
  -->
  <header class="header">
    <div class="header__logo">GWL Works Lab</div>

    <!-- 移动端汉堡菜单按钮 -->
    <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>

    <!-- 导航链接 -->
    <nav class="header__nav" id="headerNav">
      <a href="../../index.html">首页</a>
      <a href="../../document.html">文档</a>
      <a href="../../org/index.html">组织</a>
      <a href="../../discover/index.html">发现</a>
      <a href="../../login.html">登录</a>
      <a href="../../register.html">注册</a>
    </nav>

    <!-- 右侧操作区：通知和用户信息 -->
    <div class="header__actions">
      <div id="auth-container"></div>
      <div class="permission-buttons" id="permissionButtons"></div>
    </div>
  </header>

  <!-- 全局通知容器（在 header 下方，fixed 定位） -->
  <div id="global-notifications-container" class="notification-toast"></div>

  <main class="discover-main">
    <div class="discover-toolbar">
      <span class="discover-toolbar__crumbs">
        <a href="../../discover/index.html">发现</a> / <a href="../../discover/org/index.html">组织</a> / 详情
      </span>
    </div>

    <div id="discoverDetail"></div>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__top">
        <div class="footer__brand">
          <h3 class="footer__logo">GWL Works Lab</h3>
          <p class="footer__slogan">探索学习的无限可能</p>
        </div>
        <div class="footer__links">
          <div class="footer__links-group">
            <h4>快速链接</h4>
            <a href="../../index.html">首页</a>
            <a href="../../document.html">文档</a>
            <a href="../../org/index.html">组织</a>
            <a href="../../discover/index.html">发现</a>
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <p>&copy; 2026 GFYGO. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- 主题切换悬浮按钮 -->
  <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

  <!-- 脚本顺序固定：config → utils → sanitize → theme → toast → index → discover（契约 §7.2） -->
  <script src="../../js/config.js?v=20261002a"></script>
  <script src="../../js/utils.js?v=20261002a"></script>
  <script src="../../js/sanitize.js?v=20261002a"></script>
  <script src="../../js/theme.js?v=20261002a"></script>
  <script src="../../js/toast.js?v=20261002a"></script>
  <script src="../../js/index.js?v=20261002a"></script>
  <script src="../../js/discover.js?v=20261002a"></script>
</body>
</html>
