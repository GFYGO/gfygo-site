<body data-discover-page="tool-detail" data-discover-key="tool">
  <!--
    「工具详情」页：body 的 data-discover-page="tool-detail" 由 js/discover-tool.js 接管
    （js/discover.js 的通用详情不再初始化本页，doc / group / org 三板块不受影响）。
    读 ?id=<item_id>，展示：发布者 / 外部地址（打开工具、复制链接）/ 工具说明 /
    工具信息（发布者、工具地址、工具标识、收录时间）/ 同类工具。
    刻意不显示文档域的「来源类型 / 来源标识 / 展示时间」，也不再有「操作」占位说明。
    空态：id 缺失或非数字 → 「缺少有效的工具编号」；404 → 「工具不存在或未公开」；
    网络失败 → 「加载失败，请稍后重试」（带重新加载按钮）。
    本页在 /discover/tool/ 下（两层深）：静态资源前缀 ../../，window.BASE_PATH 也由 js/config.js 按 URL 目录深度算成 '../..'。
  -->

      <div class="permission-buttons" id="permissionButtons"></div>
    </div>
  </header>

  <!-- 全局通知容器（在 header 下方，fixed 定位） -->

      </div>
      <div class="footer__bottom">
        <p>&copy; 2026 GFYGO. All rights reserved.</p>
