<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://back.gwl.net.cn https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现 | GWL</title>
  <link rel="stylesheet" href="../css/core.css?v=20261002a">
  <link rel="stylesheet" href="../css/styles.css?v=20261002a">
  <link rel="stylesheet" href="../css/components.css?v=20261002a">
  <link rel="stylesheet" href="../css/discover.css?v=20261002a">
  <link rel="icon" href="../favicon.png?v=20261002a" type="image/png">
</head>
<body data-discover-page="index">
  <!--
    发现页（聚合）：板块导航 + feed({section:'all', limit:24})。
    页面逻辑全部在 js/discover.js（本页 body 的 data-discover-page="index" 触发），
    页面内不写内联脚本标签、不写内联事件处理器（CSP 会拦）。
    本页在 /discover/ 下：静态资源前缀 ../，window.BASE_PATH = '..'。
  -->
  <header class="header">
    <div class="header__logo">GWL Works Lab</div>

    <!-- 移动端汉堡菜单按钮 -->
    <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>

    <!-- 导航链接 -->
    <nav class="header__nav" id="headerNav">
      <a href="../index.html">首页</a>
      <a href="../document.html">文档</a>
      <a href="../org/index.html">组织</a>
      <a href="../discover/index.html">发现</a>
      <a href="../login.html">登录</a>
      <a href="../register.html">注册</a>
    </nav>

    <!-- 右侧操作区：通知和用户信息 -->
    <div class="header__actions">
      <div id="auth-container"></div>
      <div class="permission-buttons" id="permissionButtons"></div>
    </div>
  </header>

  <!-- 全局通知容器（在 header 下方，fixed 定位） -->
  <div id="global-notifications-container" class="notification-toast"></div>

  <main class="discover-main">
    <section class="discover-hero">
      <h1 class="discover-hero__title">发现</h1>
      <p class="discover-hero__desc">
        这里是公开内容的展示广场：文档、组、组织与工具。只有公开内容、且由所有者在展示页开启后，才会出现在下面。
      </p>
      <div class="discover-hero__actions">
        <a class="discover-action" href="../discover/own-site.html">管理我的展示内容</a>
      </div>
    </section>

    <section aria-labelledby="discoverBoardsTitle">
      <h2 class="discover-section-title" id="discoverBoardsTitle">板块</h2>
      <div class="discover-boards" id="discoverBoardNav"></div>
    </section>

    <div class="discover-toolbar">
      <span class="discover-toolbar__crumbs">全部板块</span>
      <span class="discover-toolbar__meta" id="discoverMeta"></span>
    </div>

    <section aria-label="发现内容">
      <div class="discover-grid" id="discoverFeed"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__top">
        <div class="footer__brand">
          <h3 class="footer__logo">GWL Works Lab</h3>
          <p class="footer__slogan">探索学习的无限可能</p>
        </div>
        <div class="footer__links">
          <div class="footer__links-group">
            <h4>快速链接</h4>
            <a href="../index.html">首页</a>
            <a href="../document.html">文档</a>
            <a href="../org/index.html">组织</a>
            <a href="../discover/index.html">发现</a>
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <p>&copy; 2026 GFYGO. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- 主题切换悬浮按钮 -->
  <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

  <!-- 脚本顺序固定：config → utils → sanitize → theme → toast → index → discover（契约 §7.2） -->
  <script src="../js/config.js?v=20261002a"></script>
  <script src="../js/utils.js?v=20261002a"></script>
  <script src="../js/sanitize.js?v=20261002a"></script>
  <script src="../js/theme.js?v=20261002a"></script>
  <script src="../js/toast.js?v=20261002a"></script>
  <script src="../js/index.js?v=20261002a"></script>
  <script src="../js/discover.js?v=20261002a"></script>
</body>
</html>
