<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header__logo">MyApp</div>
    <nav class="header__nav"><a href="index.html">返回首页</a></nav>
  </header>

  <!-- Login Page (FE-UI-02) -->
  <main class="login-page">
    <div class="login-card">
      <h2 class="login-card__title">账号登录</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">邮箱地址</label>
          <input type="email" id="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        
        <!-- Turnstile 验证组件挂载点 -->
        <div id="turnstile-container" class="turnstile-mount"></div>

        <button type="submit" class="btn-primary">登 录</button>
      </form>
    </div>
  </main>
</body>
</html>
