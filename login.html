<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWL | 个人学习平台 - 登录</title>
    <!-- 任务 FE-JS-01: 引入 Cloudflare Turnstile SDK -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body class="theme-light">
    <!-- 全局 Header -->
    <header class="header">
        <div class="header__logo">GWL</div>
        <!-- 移动端汉堡菜单按钮 -->
        <button class="header__toggle" id="menuToggle">☰</button>
        <nav class="header__nav">
            <a href="index.html">首页</a>
            <a href="document.html">文档</a>
            <a href="login.html" style="color: var(--color-primary); font-weight: 600;">登录</a>
            <a href="register.html">注册</a>
        </nav>
    </header>

    <!-- 登录表单区域 -->
    <div class="login-page">
        <div class="login-card">
            <h2 class="login-card__title">系统登录</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" name="username" placeholder="用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="密码" required>
                </div>
                
                <!-- 任务 FE-JS-01: 渲染 Turnstile 验证组件 -->
                <div class="turnstile-mount">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAABs6a1WlAXmVstmB"></div>
                </div>
                
                <button type="submit" class="btn-primary">登录</button>
            </form>
        </div>
    </div>

    <!-- 右下角主题切换按钮 -->
    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>
    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script src="toast.js"></script>
    <script src="login.js"></script>
    
</body>
</html>
