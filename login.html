<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://back.gwl.net.cn https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="dns-prefetch" href="//back.gwl.net.cn">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登录 | GWL</title>
    <!-- Cloudflare Turnstile：SDK 与组件挂载都在 js/turnstile-widget.js 里，
         login.js 只负责「取 token + 提交」，两者互不依赖（SDK 挂掉也能正常提示） -->
    <link rel="stylesheet" href="./css/core.css?v=20261026d">
    <link rel="stylesheet" href="./css/styles.css?v=20261026d">
    <link rel="stylesheet" href="./css/login.css?v=20261026d">
    <!-- forgot.css 提供「忘记密码？」链接（.login-forgot-link）与重置页共用的 auth-* 样式 -->
    <link rel="stylesheet" href="./css/forgot.css?v=20261026d">
    <link rel="stylesheet" href="./css/components.css?v=20261026d">
    <link rel="icon" href="./favicon.png" type="image/png">
</head>
<body>
    <!-- 全局 Header -->
    <header class="header">
        <div class="header__logo">GWL Works Lab</div>
        <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>
        <nav class="header__nav" id="headerNav">
            <a href="./index.html">首页</a>
            <a href="./document.html">文档</a>
            <a href="./org/index.html">组织</a>
            <a href="./discover/index.html">发现</a>
            <a href="./login.html" style="color: var(--color-primary); font-weight: 600;">登录</a>
            <a href="./register.html">注册</a>
        </nav>
        <div class="header__actions">
            <div id="auth-container"></div>
            <div class="permission-buttons" id="permissionButtons"></div>
        </div>
    </header>

    <!-- 登录表单区域 -->
    <div class="login-page">
        <div class="login-card">
            <h1 class="login-card__title">系统登录</h1>
            <form id="loginForm">
                <div class="form-group">
                    <!-- ⭐ P2 可访问性（2026-10-15 审查）：只有 placeholder 没有 label ——
                         屏幕阅读器拿不到字段名；同时补 autocomplete 让密码管理器可用。 -->
                    <input type="text" name="username" placeholder="用户名" required
                           aria-label="用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="密码" required
                           aria-label="密码" autocomplete="current-password">
                </div>

                <p class="login-forgot-link"><a href="./forgot.html">忘记密码？</a></p>

                <!-- Turnstile 验证组件 -->
                <div class="turnstile-mount">
                    <div id="turnstile-widget-login"></div>
                </div>

                <button type="submit" class="btn-primary">登录</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__container">
            <div class="footer__top">
                <div class="footer__brand">
                    <h3 class="footer__logo">GWL Works Lab</h3>
                    <p class="footer__slogan">探索学习的无限可能</p>
                </div>
                <div class="footer__links">
                    <div class="footer__links-group footer__links-group--quick">
                        <h4>快速链接</h4>
                        <a href="./index.html">首页</a>
                        <a href="./document.html">文档</a>
                        <a href="./login.html">登录</a>
                        <a href="./org/index.html">组织</a>
                        <a href="./discover/index.html">发现</a>
                        <a href="./register.html">注册</a>
                    </div>
                    <div class="footer__links-group">
                        <h4>关于</h4>
                        <a href="/about.html">关于我们</a>
                        <a href="/privacy.html">隐私政策</a>
                        <a href="/terms.html">服务条款</a>
                    </div>
                </div>
            </div>
            <div class="footer__bottom">
                <p>&copy; 2026 GFYGO. All rights reserved.</p>
                <div class="footer__social">
                    <a href="https://github.com/GFYGO/gfygo-site" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
                    <a href="https://www.bilibili.com/video/BV1g34y1j7e5/" target="_blank" rel="noopener noreferrer" aria-label="Bilibili">Bilibili</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- 主题切换悬浮按钮 -->
    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./js/config.js?v=20261026d"></script>
    <script src="./js/theme.js?v=20261026d"></script>
    <script src="./js/toast.js?v=20261026d"></script>
    <!-- ⚠️ js/index.js 未改动：版本号沿用 20260911e
         （tools/test-permission-switch.mjs 会断言引用它的页面就是这一版） -->
    <script src="./js/index.js?v=20261026d"></script>
    <script src="./js/turnstile-widget.js?v=20261026d"></script>
    <script src="./js/login.js?v=20261026d"></script>
</body>
</html>
