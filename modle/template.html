<!DOCTYPE html>
<!--
  GFYGO 通用页面模板 (template.html)
  ====================================
  使用说明：
  1. 复制此文件到目标位置（根目录或 user/ 子目录）
  2. 修改 <title> 和主体内容
  3. 根据所在目录调整相对路径：
     - 根目录页面：href="./xxx"  src="./xxx"
     - user/ 子目录：href="../xxx"  src="../xxx"
  4. 根目录页面引入 JS 顺序：config.js → theme.js → toast.js → index.js → 页面专属.js
     user/ 子目录引入 JS：../config.js → ../theme.js → ../toast.js → ../index.js → 页面专属.js
  5. 需要登录的页面在 DOMContentLoaded 中调用 AuthGuard.requireAuth()
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWL | 页面标题</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="../favicon.png" type="image/png">
</head>
<body>
  <!-- ============================================
       顶部导航栏 (Header)
       ============================================ -->
  <header class="header">
    <div class="header__logo">GWL Works Lab</div>

    <!-- 移动端汉堡菜单按钮 -->
    <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>

    <!-- 导航链接 -->
    <nav class="header__nav" id="headerNav">
      <a href="../index.html">首页</a>
      <a href="../document.html">文档</a>
      <a href="../login.html">登录</a>
      <a href="../register.html">注册</a>
    </nav>

    <!-- 右侧操作区：用户信息（由 JS 动态填充） -->
    <div class="header__actions">
      <div id="auth-container"></div>
    </div>
  </header>

  <!-- ============================================
       主体内容区 (Main)
       ============================================ -->
  <main>
    <section class="home-section">
      <h1 class="home-section__title">页面标题</h1>
      <p class="home-section__desc">在此处放置页面内容。</p>
    </section>
  </main>

  <!-- ============================================
       底部导航 (Footer)
       ============================================ -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__top">
        <div class="footer__brand">
          <h3 class="footer__logo">GWL Works Lab</h3>
          <p class="footer__slogan">探索学习的无限可能</p>
        </div>
        <div class="footer__links">
          <div class="footer__links-group">
            <h4>快速链接</h4>
            <a href="../index.html">首页</a>
            <a href="../document.html">文档</a>
            <a href="../login.html">登录</a>
          </div>
          <div class="footer__links-group">
            <h4>关于</h4>
            <a href="#">关于我们</a>
            <a href="#">隐私政策</a>
            <a href="#">服务条款</a>
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <p>&copy; 2026 GFYGO. All rights reserved.</p>
        <div class="footer__social">
          <a href="#" aria-label="GitHub">GitHub</a>
          <a href="#" aria-label="Bilibili">Bilibili</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- ============================================
       右下角主题切换悬浮按钮
       ============================================ -->
  <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

  <!-- ============================================
       JS 引入（顺序很重要：config → theme → toast → index → 页面专属）
       ============================================ -->
  <script src="../config.js"></script>
  <script src="../theme.js"></script>
  <script src="../toast.js"></script>
  <script src="../modal.js"></script>
  <script src="../index.js"></script>
  <!-- <script src="../page-specific.js"></script> -->
</body>
</html>
