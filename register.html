<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWL | 个人学习平台 - 注册</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="./register.css">
    <link rel="icon" href="./favicon.png" type="image/png">
</head>
<body>
    <header class="header">
        <div class="header__logo">GWL Works Lab</div>
        <button class="header__toggle" id="menuToggle" aria-label="切换菜单">☰</button>
        <nav class="header__nav" id="headerNav">
            <a href="./index.html">首页</a>
            <a href="./document.html">文档</a>
            <a href="./login.html">登录</a>
            <a href="./register.html" style="color: var(--color-primary); font-weight: 600;">注册</a>
        </nav>
        <div class="header__actions">
            <div id="auth-container"></div>
        </div>
    </header>

    <div class="login-page">
        <div class="login-card register-card">
            <h2 class="login-card__title">注册账号</h2>

            <div class="register-tabs" id="registerTabs">
                <button class="register-tab register-tab--active" data-tab="email" type="button">邮件注册</button>
                <button class="register-tab" data-tab="phone" type="button">手机号注册</button>
                <button class="register-tab" data-tab="temp" type="button">临时访问</button>
            </div>

            <form id="emailForm" class="register-form register-form--active">
                <div class="form-group">
                    <input type="email" name="email" id="emailInput" placeholder="邮箱地址" required>
                </div>
                <div class="form-group form-group--code">
                    <input type="text" name="code" id="emailCodeInput" placeholder="邮箱验证码（6位）" maxlength="6" pattern="[0-9]{6}">
                    <button type="button" class="btn-send-code" id="sendEmailCodeBtn">发送验证码</button>
                </div>
                <div class="form-group">
                    <input type="text" name="username" placeholder="用户名（不可重复）" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" placeholder="确认密码" required minlength="6">
                </div>
                <label class="register-agreement">
                    <input type="checkbox" name="agree" required>
                    <span>我已阅读并同意 <a href="#" style="color: var(--color-primary);">服务条款</a> 和 <a href="#" style="color: var(--color-primary);">隐私政策</a></span>
                </label>
                <div class="turnstile-mount">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAABs6a1WlAXmVstmB"></div>
                </div>
                <button type="submit" class="btn-primary">注册</button>
                <p class="register-switch">已有账号？<a href="./login.html">去登录</a></p>
            </form>

            <form id="phoneForm" class="register-form">
                <div class="form-group">
                    <input type="tel" name="phone" placeholder="手机号码" required pattern="[0-9]{11}">
                </div>
                <div class="form-group">
                    <input type="text" name="username" placeholder="用户名（不可重复）" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" placeholder="确认密码" required minlength="6">
                </div>
                <label class="register-agreement">
                    <input type="checkbox" name="agree" required>
                    <span>我已阅读并同意 <a href="#" style="color: var(--color-primary);">服务条款</a> 和 <a href="#" style="color: var(--color-primary);">隐私政策</a></span>
                </label>
                <div class="turnstile-mount">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAABs6a1WlAXmVstmB"></div>
                </div>
                <button type="submit" class="btn-primary">注册</button>
                <p class="register-switch">已有账号？<a href="./login.html">去登录</a></p>
            </form>

            <form id="tempForm" class="register-form">
                <div class="form-group">
                    <input type="text" name="username" placeholder="真实用户名" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="text" name="invite_code" placeholder="邀请码" required>
                </div>
                <div class="register-hint">
                    <p>💡 临时访问由邀请码创建，权限等级为 1，有效期为 7 天。</p>
                </div>
                <div class="turnstile-mount">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAABs6a1WlAXmVstmB"></div>
                </div>
                <button type="submit" class="btn-primary">进入系统</button>
                <p class="register-switch">已有账号？<a href="./login.html">去登录</a></p>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__top">
                <div class="footer__brand">
                    <h3 class="footer__logo">GWL Works Lab</h3>
                    <p class="footer__slogan">探索学习的无限可能</p>
                </div>
                <div class="footer__links">
                    <div class="footer__links-group">
                        <h4>快速链接</h4>
                        <a href="./index.html">首页</a>
                        <a href="./document.html">文档</a>
                        <a href="./login.html">登录</a>
                    </div>
                    <div class="footer__links-group">
                        <h4>关于</h4>
                        <a href="#">关于我们</a>
                        <a href="#">隐私政策</a>
                        <a href="#">服务条款</a>
                    </div>
                </div>
            </div>
            <div class="footer__bottom">
                <p>&copy; 2026 GFYGO. All rights reserved.</p>
                <div class="footer__social">
                    <a href="#" aria-label="GitHub">GitHub</a>
                    <a href="#" aria-label="Bilibili">Bilibili</a>
                </div>
            </div>
        </div>
    </footer>

    <button id="theme-selector" class="theme-switcher" aria-label="切换主题"></button>

    <script src="./config.js"></script>
    <script src="./theme.js"></script>
    <script src="./toast.js"></script>
    <script src="./index.js"></script>
    <script src="./register.js"></script>
</body>
</html>
